# Bora Passageiro — Nginx Config
# Servir landing pages em subdomínios separados
# Deploy: copiar para /etc/nginx/sites-available/ no VPS

# ─── PASSAGEIRO ─────────────────────────────────────────
server {
    listen 80;
    server_name passageiro.borapassageiroxinguara.com.br;

    root /var/www/borapassageiro/dist;
    index index.html;

    # SPA — redireciona todas as rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ─── MOTORISTA ──────────────────────────────────────────
server {
    listen 80;
    server_name motorista.borapassageiroxinguara.com.br;

    root /var/www/borapassageiro/dist;
    index index.html;

    # Rewrite: motorista subdomain → /motorista route
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
