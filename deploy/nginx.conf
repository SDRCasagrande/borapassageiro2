# ─── ADMIN ──────────────────────────────────────────────
server {
    listen 80;
    server_name admin.borapassageiroxinguara.com.br;

    root /var/www/borapassageiro/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ─── DOMÍNIO PRINCIPAL (redireciona para passageiro) ────
server {
    listen 80;
    server_name borapassageiroxinguara.com.br www.borapassageiroxinguara.com.br;

    return 301 https://passageiro.borapassageiroxinguara.com.br$request_uri;
}
